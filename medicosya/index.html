  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}

    background:#3f6fd8;color:#fff;border:none;border-radius:10px;white-space:nowrap;
  }

  button:disabled{opacity:.55;cursor:default}
  .error{color:#f0868a;font-size:13.5px;margin-top:13px;min-height:19px}
  .pie{margin-top:30px;font-size:12px;color:#5f7099;line-height:1.6}

      var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveKey"]);
      var k=await crypto.subtle.deriveKey(
        {name:"PBKDF2",salt:b2a(SALT),iterations:ITER,hash:"SHA-256"},
        base,{name:"AES-GCM",length:256},false,["decrypt"]);
      var claro=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(IV)},k,b2a(DATA));
      var html=new TextDecoder().decode(claro);
      document.open();document.write(html);document.close();
    }catch(e){
      btn.disabled=false;btn.textContent="Abrir";
      err.textContent="Contrasena incorrecta.";
      pw.value="";pw.focus();
    }
  }

  btn.addEventListener("click",abrir);
  pw.addEventListener("keydown",function(e){if(e.key==="Enter")abrir();});
  window.addEventListener("load",function(){pw.focus();});
  if(!window.crypto||!crypto.subtle){
    err.textContent="Abre este documento en Chrome, Safari o Edge actualizados.";
    btn.disabled=true;
  }
})();
</script>
</body>
</html>
