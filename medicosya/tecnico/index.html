  var pw=document.getElementById("pw"), btn=document.getElementById("btn"), err=document.getElementById("err");

  function b2a(b64){var s=atob(b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}

  async function abrir(){
    var clave=pw.value;
    if(!clave){err.textContent="Escribe la contrasena.";pw.focus();return;}
    btn.disabled=true;btn.textContent="Abriendo...";err.textContent="";
    try{
      var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveKey"]);

      pw.value="";pw.focus();
